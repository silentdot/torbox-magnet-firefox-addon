<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TorBox Magnet — Options</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    .container { padding: 0; }
    h2 { font-size: 18px; margin-bottom: 12px; color: var(--text-primary); }
    .desc { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  </style>
</head>
<body data-theme="dark">
  <div class="container">
    <h2>Options</h2>
    <p class="desc">Configure your TorBox Magnet extension settings below.</p>

    <div class="section">
      <label for="opt-api-key" class="label">TorBox API Key</label>
      <input type="password" id="opt-api-key" class="input" placeholder="Paste your API key">
      <button id="opt-save" class="btn btn-primary">Save</button>
      <p id="opt-status" class="status"></p>
    </div>

    <div class="section">
      <label class="label">Appearance</label>
      <button id="opt-theme-toggle" class="btn btn-primary">Toggle Dark / Light Mode</button>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
