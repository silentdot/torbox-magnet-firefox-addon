<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TorBox Magnet</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">

    <!-- SVG ICON SPRITE -->
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
      <defs>
        <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </symbol>
        <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </symbol>
        <symbol id="i-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </symbol>
        <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </symbol>
        <symbol id="i-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </symbol>
        <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
        </symbol>
        <symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </symbol>
        <symbol id="i-app" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>
        </symbol>
      </defs>
    </svg>

    <div class="accent-bar"></div>

    <header class="header">
      <div class="header-left">
        <img src="../icons/icon.svg" alt="" class="logo" width="24" height="24">
        <h1 class="title">TorBox Magnet</h1>
      </div>
      <div class="header-right">
        <span id="live-dot" class="live-dot"></span>
        <button id="settings-toggle" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24"><use href="#i-gear"/></svg>
        </button>
      </div>
    </header>

    <div id="main-content" class="hidden">
      <section class="section">
        <div class="section-row">
          <span class="section-label">Current page</span>
          <span class="pill" id="page-domain">&mdash;</span>
        </div>
        <button id="send-page" class="btn btn-primary">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24"><use href="#i-send"/></svg>
          Send Page Magnets
        </button>
        <p id="action-status" class="status"></p>
      </section>

      <section class="section">
        <div class="section-row">
          <span class="section-label">History</span>
          <div class="section-actions">
            <button id="open-dashboard" class="ghost-btn" title="Open TorBox dashboard">
              <svg width="12" height="12" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:3px"><use href="#i-grid"/></svg>
              Dashboard
            </button>
            <button id="clear-history" class="ghost-btn ghost-btn--danger" title="Clear history">
              <svg width="12" height="12" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:3px"><use href="#i-trash"/></svg>
              Clear
            </button>
          </div>
        </div>
        <div id="history-section">
          <div class="empty-state">No downloads yet.</div>
        </div>
      </section>
    </div>

    <div id="connect-panel" class="section connect-panel">
      <div class="connect-header">
        <svg width="26" height="26" viewBox="0 0 24 24" class="connect-icon"><use href="#i-link"/></svg>
        <span class="connect-title">Connect to TorBox</span>
      </div>
      <p class="connect-desc">Paste your API key from <a href="https://torbox.app/settings" target="_blank" class="inline-link">torbox.app/settings</a></p>
      <div class="input-row">
        <input type="password" id="api-key" class="input" placeholder="tb_api_..." autofocus>
        <button id="save-key" class="btn btn-primary btn--compact">Connect</button>
      </div>
      <p id="key-status" class="status"></p>
    </div>

    <div id="settings-drawer" class="settings-drawer hidden">
      <div class="drawer-scrim"></div>
      <div class="drawer-panel">
        <div class="drawer-header">
          <span class="drawer-title">Settings</span>
          <button id="settings-close" class="icon-btn icon-btn--sm">
            <svg width="14" height="14" viewBox="0 0 24 24"><use href="#i-close"/></svg>
          </button>
        </div>
        <div class="drawer-body">
          <label class="drawer-label">API Key</label>
          <div class="drawer-row">
            <span class="drawer-value" id="drawer-email">&mdash;</span>
            <button id="drawer-change-key" class="ghost-btn">Change</button>
          </div>
          <label class="drawer-label">Theme</label>
          <div class="drawer-row">
            <span class="drawer-value" id="drawer-theme-label">Dark</span>
            <button id="drawer-theme-toggle" class="ghost-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:middle;margin-right:4px"><use href="#i-moon"/></svg>
              Toggle
            </button>
          </div>
          <label class="drawer-label">About</label>
          <p class="drawer-about">TorBox Magnet v1.1.1</p>
          <p class="drawer-about-sub">Send magnet links directly to your TorBox account.</p>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
